elves, and my brother Benjamin for himself, that it is indeed I who am speaking to you. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Genesis 46:10", "label": "Genesis 46:10", "shape": "dot", "size": 8, "title": "Simeon\u2019s sons: Jemuel, Jamin, Ohad, Jachin, Zohar, and SauldSaul Or \u201cShaul.\u201d the son of a Canaanite woman. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Genesis 48:13", "label": "Genesis 48:13", "shape": "dot", "size": 8, "title": "Joseph took the two of them, Ephraim with his right hand\u2014to Israel\u2019s left\u2014and Manasseh with his left hand\u2014to Israel\u2019s right\u2014and brought them close to him. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Genesis 49:27", "label": "Genesis 49:27", "shape": "dot", "size": 8, "title": "Benjamin is a ravenous wolf;In the morning he consumes the foe,jfoe Meaning of Heb. \u02bbad uncertain; in contrast to others \u201cbooty.\u201d And in the evening he divides the spoil.\u201d"}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Habakkuk 2:16", "label": "Habakkuk 2:16", "shape": "dot", "size": 8, "title": "You shall be sated with shameRather than glory:Drink in your turn and stagger!ostagger Emendation yields \u201cuncover yourself\u201d; cf. Lam. 4.21. The cup in GOD\u2019s right hand Shall come around to you,And disgrace topdisgrace to Or \u201cvomit of disgrace upon.\u201d your glory."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Hosea 5:8", "label": "Hosea 5:8", "shape": "dot", "size": 8, "title": "Sound a ram\u2019s horn in Gibeah,A trumpet in Ramah;Give the alarm in Beth-aven;hGibeah\u2026Ramah\u2026Beth-aven The three towns named, in the territory of Benjamin, are now being wrested from Israel by Judah; see v. 10. On the latter town\u2019s name, see second note at 4.15. After you,iAfter you Emendation yields \u201cStir up.\u201d Benjamin!"}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "II_Chronicles 3:17", "label": "I 0 with Jonathan in Gibeah of Benjamin; the rest of the troops he sent back to their homes. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "I_Samuel 23:19", "label": "I_Samuel 23:19", "shape": "dot", "size": 8, "title": "eThe meaning of many parts of 23.19ff. is uncertain. The events described in 23.19\u201324.22 are partly paralleled in chapter 26, with variations. Some Ziphites went up to Saul in Gibeah and said, \u201cDavid is hiding among us in the strongholds of Horesh, at the hill of Hachilah south of Jeshimon. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "I_Samuel 23:24", "label": "I_Samuel 23:24", "shape": "dot", "size": 8, "title": "They left at once for Ziph, ahead of Saul; David and his men were then in the wilderness of Maon, in the Arabah, to the south of Jeshimon. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Jeremiah 32:8", "label": "Jeremiah 32:8", "shape": "dot", "size": 8, "title": "And just as GOD had said, my cousin Hanamel came to me in the prison compound and said to me, \u201cPlease buy my land in Anathoth, in the territory of Benjamin; for the right of succession is yours, and you have the duty of redemption. Buy it.\u201d Then I knew that it was indeed the word of GOD."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Job 23:9", "label": "Job 23:9", "shape": "dot", "size": 8, "title": "North\u2014I cannot discern One who is concealed;South\u2014also there hidden from my sight."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Job 30:12", "label": "Job 30:12", "shape": "dot", "size": 8, "title": "Mere striplings assail me at my right hand:They put me to flight;They build their roads for my ruin."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Joshua 1:7", "label": "Joshua 1:7", "shape": "dot", "size": 8, "title": "But you must be very strong and resolute to observe faithfully all the Teaching that My servant Moses enjoined upon you. Do not deviate from it to the right or to the left, that you may be successful wherever you go. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Joshua 17:7", "label": "Joshua 17:7", "shape": "dot", "size": 8, "title": "The boundary of Manasseh ran from Asher to Michmethath, which lies near Shechem. The boundary continued to the right, toward the inhabitants of En-tappuah.\u2014 "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Joshua 21:17", "label": "Joshua 21:17", "shape": "dot", "size": 8, "title": "And from the tribe of Benjamin: Gibeon with its pastures, Geba with its pastures, "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Joshua 23:6", "label": "Joshua 23:6", "shape": "dot", "size": 8, "title": "\u201cBut be most resolute to observe faithfully all that is written in the Book of the Teaching of Moses, without ever deviating from it to the right or to the left, "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Judges 5:14", "label": "Judges 5:14", "shape": "dot", "size": 8, "title": "From Ephraim came they whose roots are in Amalek;After you, your kin Benjamin;From Machir came down leaders,From Zebulun such as hold the marshal\u2019s staff."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Judges 10:9", "label": "Judges 10:9", "shape": "dot", "size": 8, "title": "The Ammonites also crossed the Jordan to make war on Judah, Benjamin, and the House of Ephraim. Israel was in great distress."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Leviticus 7:32", "label": "Leviticus 7:32", "shape": "dot", "size": 8, "title": "And the right thigh from your sacrifices of well-being you shall present to the priest as a gift;"}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Leviticus 7:33", "label": "Leviticus 7:33", "shape": "dot", "size": 8, "title": "he from among Aaron\u2019s sons who offers the blood and the fat of the offering of well-being shall get the right thigh as his portion."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "
