her to the right or to the left."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Deuteronomy 17:20", "label": "Deuteronomy 17:20", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Deuteronomy 17:20\nOriginal: \u05dc\u05d1\u05dc\u05ea\u05d9 \u05e8\u05d5\u05dd\u05dc\u05d1\u05d1\u05d5 \u05de\u05d0\u05d7\u05d9\u05d5 \u05d5\u05dc\u05d1\u05dc\u05ea\u05d9 \u05e1\u05d5\u05e8 \u05de\u05df\u05d4\u05de\u05e6\u05d5\u05d4 \u05d9\u05de\u05d9\u05df \u05d5\u05e9\u05de\u05d0\u05d5\u05dc \u05dc\u05de\u05e2\u05df \u05d9\u05d0\u05e8\u05d9\u05da \u05d9\u05de\u05d9\u05dd \u05e2\u05dc\u05de\u05de\u05dc\u05db\u05ea\u05d5 \u05d4\u05d5\u05d0 \u05d5\u05d1\u05e0\u05d9\u05d5 \u05d1\u05e7\u05e8\u05d1 \u05d9\u05e9\u05e8\u05d0\u05dc\u0026nbsp;\u003cspan class=\"mam-spi-samekh\"\u003e{\u05e1}\u003c/span\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\nTraducci\u00f3n: Thus he will not act haughtily toward his fellows or deviate from the Instruction to the right or to the left, to the end that he and his descendants may reign long in the midst of Israel."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Deuteronomy 28:14", "label": "Deuteronomy 28:14", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Deuteronomy 28:14\nOriginal: \u05d5\u05dc\u05d0 \u05ea\u05e1\u05d5\u05e8 \u05de\u05db\u05dc\u05d4\u05d3\u05d1\u05e8\u05d9\u05dd \u05d0\u05e9\u05e8 \u05d0\u05e0\u05db\u05d9 \u05de\u05e6\u05d5\u05d4 \u05d0\u05ea\u05db\u05dd \u05d4\u05d9\u05d5\u05dd \u05d9\u05de\u05d9\u05df \u05d5\u05e9\u05de\u05d0\u05d5\u05dc \u05dc\u05dc\u05db\u05ea \u05d0\u05d7\u05e8\u05d9 \u05d0\u05dc\u05d4\u05d9\u05dd \u05d0\u05d7\u05e8\u05d9\u05dd \u05dc\u05e2\u05d1\u05d3\u05dd\u0026nbsp;\u003cspan class=\"mam-spi-pe\"\u003e{\u05e4}\u003c/span\u003e\u003cbr\u003e\nTraducci\u00f3n: and do not deviate to the right or to the left from any of the commandments that I enjoin upon you this day and turn to the worship of other gods."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Exodus 6:15", "label": "Exodus 6:15", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Exodus 6:15\nOriginal: \u05d5\u05d1\u05e0\u05d9 \u05e9\u05de\u05e2\u05d5\u05df \u05d9\u05de\u05d5\u05d0\u05dc \u05d5\u05d9\u05de\u05d9\u05df \u05d5\u05d0\u05d4\u05d3 \u05d5\u05d9\u05db\u05d9\u05df \u05d5\u05e6\u05d7\u05e8 \u05d5\u05e9\u05d0\u05d5\u05dc \u05d1\u05df\u05d4\u05db\u05e0\u05e2\u05e0\u05d9\u05ea \u05d0\u05dc\u05d4 \u05de\u05e9\u05e4\u05d7\u05ea \u05e9\u05de\u05e2\u05d5\u05df\nTraducci\u00f3n: The sons of Simeon: Jemuel, Jamin, Ohad, Jachin, Zohar, and SaulfSaul Or \u201cShaul\u201d; cf. note at Gen. 46.10. the son of a Canaanite woman; those are the families of Simeon. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Exodus 29:22", "label": "Exodus 29:22", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Exodus 29:22\nOriginal: \u05d5\u05dc\u05e7\u05d7\u05ea \u05de\u05df\u05d4\u05d0\u05d9\u05dc \u05d4\u05d7\u05dc\u05d1 \u05d5\u05d4\u05d0\u05dc\u05d9\u05d4 \u05d5\u05d0\u05ea\u05d4\u05d7\u05dc\u05d1\u0026thinsp;\u003cb\u003e\u003c/b\u003e \u05d4\u05de\u05db\u05e1\u05d4 \u05d0\u05ea\u05d4\u05e7\u05e8\u05d1 \u05d5\u05d0\u05ea \u05d9\u05ea\u05e8\u05ea \u05d4\u05db\u05d1\u05d3 \u05d5\u05d0\u05ea\u0026thinsp;\u003cb\u003e\u003c/b\u003e \u05e9\u05ea\u05d9 \u05d4\u05db\u05dc\u05d9\u05ea \u05d5\u05d0\u05ea\u05d4\u05d7\u05dc\u05d1 \u05d0\u05e9\u05e8 \u05e2\u05dc\u05d9\u05d4\u05df \u05d5\u05d0\u05ea \u05e9\u05d5\u05e7 \u05d4\u05d9\u05de\u05d9\u05df \u05db\u05d9 \u05d0\u05d9\u05dc \u05de\u05dc\u05d0\u05d9\u05dd \u05d4\u05d5\u05d0\nTraducci\u00f3n: You shall take from the ram the fat parts\u2014the broad tail, the fat that covers the entrails, the protuberance on the liver, the two kidneys with the fat on them\u2014and the right thigh; for this is a ram of ordination. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Ezekiel 1:10", "label": "Ezekiel 1:10", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Ezekiel 1:10\nOriginal: \u05d5\u05d3\u05de\u05d5\u05ea \u05e4\u05e0\u05d9\u05d4\u05dd \u05e4\u05e0\u05d9 \u05d0\u05d3\u05dd \u05d5\u05e4\u05e0\u05d9 \u05d0\u05e8\u05d9\u05d4 \u05d0\u05dc\u05d4\u05d9\u05de\u05d9\u05df \u05dc\u05d0\u05e8\u05d1\u05e2\u05ea\u05dd \u05d5\u05e4\u05e0\u05d9\u05e9\u05d5\u05e8 \u05de\u05d4\u05e9\u05de\u05d0\u05d5\u05dc \u05dc\u05d0\u05e8\u05d1\u05e2\u05ea\u05df \u05d5\u05e4\u05e0\u05d9\u05e0\u05e9\u05e8 \u05dc\u05d0\u05e8\u05d1\u05e2\u05ea\u05df\nTraducci\u00f3n: Each of them had a human face [at the front]; each of the four had the face of a lion on the right; each of the four had the face of an ox on the left; and each of the four had the face of an eagle [at the back]."}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Ezekiel 10:3", "label": "Ezekiel 10:3", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Ezekiel 10:3\nOriginal: \u05d5\u05d4\u05db\u05e8\u05d1\u05d9\u05dd \u05e2\u05de\u05d3\u05d9\u05dd \u05de\u05d9\u05de\u05d9\u05df \u05dc\u05d1\u05d9\u05ea \u05d1\u05d1\u05d0\u05d5 \u05d4\u05d0\u05d9\u05e9 \u05d5\u05d4\u05e2\u05e0\u05df \u05de\u05dc\u05d0 \u05d0\u05ea\u05d4\u05d7\u05e6\u05e8 \u05d4\u05e4\u05e0\u05d9\u05de\u05d9\u05ea\nTraducci\u00f3n: Now the cherubs were standing on the south side of the House when that figure entered, and the cloud filled the inner court. "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Genesis 13:9", "label": "Genesis 13:9", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Genesis 13:9\nOriginal: \u05d4\u05dc\u05d0 \u05db\u05dc\u05d4\u05d0\u05e8\u05e5 \u05dc\u05e4\u05e0\u05d9\u05da \u05d4\u05e4\u05e8\u05d3 \u05e0\u05d0 \u05de\u05e2\u05dc\u05d9 \u05d0\u05dd\u05d4\u05e9\u05de\u05d0\u05dc \u05d5\u05d0\u05d9\u05de\u05e0\u05d4 \u05d5\u05d0\u05dd\u05d4\u05d9\u05de\u05d9\u05df \u05d5\u05d0\u05e9\u05de\u05d0\u05d9\u05dc\u05d4\nTraducci\u00f3n: Is not the whole land before you? Let us separate:aLet us separate Lit. \u201cPlease separate from me.\u201d if you go north, I will go south; and if you go south, I will go north.\u201d "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Genesis 24:49", "label": "Genesis 24:49", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Genesis 24:49\nOriginal: \u05d5\u05e2\u05ea\u05d4 \u05d0\u05dd\u05d9\u05e9\u05db\u05dd \u05e2\u05e9\u05d9\u05dd \u05d7\u05e1\u05d3 \u05d5\u05d0\u05de\u05ea \u05d0\u05ea\u05d0\u05d3\u05e0\u05d9 \u05d4\u05d2\u05d9\u05d3\u05d5 \u05dc\u05d9 \u05d5\u05d0\u05dd\u05dc\u05d0 \u05d4\u05d2\u05d9\u05d3\u05d5 \u05dc\u05d9 \u05d5\u05d0\u05e4\u05e0\u05d4 \u05e2\u05dc\u05d9\u05de\u05d9\u05df \u05d0\u05d5 \u05e2\u05dc\u05e9\u05de\u05d0\u05dc\nTraducci\u00f3n: And now, if you mean to treat my master with true kindness, tell me; and if not, tell me also, that I may turn right or left.\u201d"}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Genesis 35:18", "label": "Genesis 35:18", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\nVerso: Genesis 35:18\nOriginal: \u05d5\u05d9\u05d4\u05d9 \u05d1\u05e6\u05d0\u05ea \u05e0\u05e4\u05e9\u05d4 \u05db\u05d9 \u05de\u05ea\u05d4 \u05d5\u05ea\u05e7\u05e8\u05d0 \u05e9\u05de\u05d5 \u05d1\u05df\u05d0\u05d5\u05e0\u05d9 \u05d5\u05d0\u05d1\u05d9\u05d5 \u05e7\u05e8\u05d0\u05dc\u05d5 \u05d1\u05e0\u05d9\u05de\u05d9\u05df\nTraducci\u00f3n: But as she breathed her last\u2014for she was dying\u2014she named him Ben-oni;iBen-oni Understood as \u201cson of my suffering (or, strength).\u201d but his father called him Benjamin.jBenjamin I.e., \u201cson of the right hand,\u201d or \u201cson of the south.\u201d "}, {"color": "#f8fafc", "font": {"color": "white"}, "id": "Genesis 42:4", "label": "Genesis 42:4", "shape": "dot", "size": 15, "title": "\ud83d\udcd6 CAPA 0 (C\u00f3digo Base)\n\
